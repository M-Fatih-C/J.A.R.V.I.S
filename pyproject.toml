[project]
name = "jarvis"
version = "1.0.0"
description = "Yerel-öncelikli, gizliliği koruyan, çok-cihazlı kişisel AI asistan"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fatih" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "ollama>=0.4.0",
    "chromadb>=0.5.0",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-ollama>=0.2.0",
    "ddgs>=6.0.0",
    "cryptography>=43.0.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.0",
    "pyjwt>=2.9.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "fakeredis>=2.26.0",
]
# Apple Silicon (arm64) — Fast Lane için MLX yerel çıkarımı
mlx = [
    "mlx-lm>=0.20.0",
]
# Ses katmanı — STT (mlx-whisper), wake word (openWakeWord), mikrofon
voice = [
    "mlx-whisper>=0.4.0",
    "openwakeword>=0.6.0",
    "sounddevice>=0.5.0",
]
# Windows masaüstü istemcisi (PyQt6)
windows = [
    "PyQt6>=6.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Testlerde bloklayan dosya/IO çağrıları kabul edilebilir.
"tests/**" = ["ASYNC230", "ASYNC240"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
